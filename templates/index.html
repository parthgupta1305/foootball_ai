<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green: #00ff87;
            --dark: #0a0a0a;
            --card: #111111;
            --border: #1f1f1f;
            --text: #e8e8e8;
            --muted: #555;
            --user-bubble: #1a2e1a;
            --ai-bubble: #111;
        }

        body {
            background: var(--dark);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            padding: 16px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: var(--dark);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .logo-text {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            letter-spacing: 2px;
            color: var(--text);
        }

        .logo-text span {
            color: var(--green);
        }

        .reset-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 6px 14px;
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            border-color: var(--green);
            color: var(--green);
        }

        /* Layout */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 14px;
        }

        .player-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 4px;
        }

        .player-chip:hover {
            background: var(--border);
        }

        .player-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }

        .player-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
        }

        .player-id {
            font-size: 10px;
            color: var(--muted);
        }

        .sidebar-divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 20px 0;
        }

        .quick-title {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .quick-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 8px 10px;
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .quick-btn:hover {
            border-color: var(--green);
            color: var(--green);
            background: rgba(0,255,135,0.04);
        }

        /* Chat area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 28px 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        /* Welcome */
        .welcome {
            text-align: center;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .welcome-ball {
            font-size: 52px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .welcome h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 42px;
            letter-spacing: 3px;
            line-height: 1;
        }

        .welcome h1 span { color: var(--green); }

        .welcome p {
            color: var(--muted);
            font-size: 14px;
            max-width: 360px;
            line-height: 1.6;
        }

        /* Messages */
        .message {
            display: flex;
            gap: 12px;
            animation: fadeUp 0.3s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { flex-direction: row-reverse; }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .message.user .msg-avatar {
            background: var(--green);
            color: var(--dark);
        }

        .message.ai .msg-avatar {
            background: var(--border);
        }

        .msg-bubble {
            max-width: 68%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.65;
        }

        .message.user .msg-bubble {
            background: var(--user-bubble);
            border: 1px solid #2a3d2a;
            border-bottom-right-radius: 3px;
            color: #d4f0d4;
        }

        .message.ai .msg-bubble {
            background: var(--ai-bubble);
            border: 1px solid var(--border);
            border-bottom-left-radius: 3px;
            color: var(--text);
        }

        /* Typing indicator */
        .typing {
            display: flex;
            gap: 12px;
            align-items: center;
            animation: fadeUp 0.3s ease;
        }

        .typing-dots {
            display: flex;
            gap: 5px;
            padding: 14px 18px;
            background: var(--ai-bubble);
            border: 1px solid var(--border);
            border-radius: 12px;
            border-bottom-left-radius: 3px;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            background: var(--muted);
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* Input area */
        .input-area {
            padding: 16px 32px 24px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .input-box {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 12px;
            transition: border-color 0.2s;
        }

        .input-box:focus-within {
            border-color: var(--green);
        }

        textarea {
            flex: 1;
            background: none;
            border: none;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 1.5;
            max-height: 120px;
            min-height: 24px;
        }

        textarea::placeholder { color: var(--muted); }

        .send-btn {
            width: 36px;
            height: 36px;
            background: var(--green);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: opacity 0.2s, transform 0.1s;
        }

        .send-btn:hover { opacity: 0.85; }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .send-btn svg {
            width: 16px;
            height: 16px;
            fill: var(--dark);
        }

        .input-hint {
            font-size: 11px;
            color: var(--muted);
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-icon">⚽</div>
        <div class="logo-text">FOOTBALL <span>AI</span></div>
    </div>
    <button class="reset-btn" onclick="resetChat()">New Chat</button>
</header>

<div class="main">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-title">Players</div>

        <div class="player-chip" onclick="askAbout('Messi')">
            <div class="player-avatar">🇦🇷</div>
            <div>
                <div class="player-name">Messi</div>
                <div class="player-id">#28003</div>
            </div>
        </div>

        <div class="player-chip" onclick="askAbout('Ronaldo')">
            <div class="player-avatar">🇵🇹</div>
            <div>
                <div class="player-name">Ronaldo</div>
                <div class="player-id">#8198</div>
            </div>
        </div>

        <div class="player-chip" onclick="askAbout('Haaland')">
            <div class="player-avatar">🇳🇴</div>
            <div>
                <div class="player-name">Haaland</div>
                <div class="player-id">#418560</div>
            </div>
        </div>

        <div class="player-chip" onclick="askAbout('Mbappe')">
            <div class="player-avatar">🇫🇷</div>
            <div>
                <div class="player-name">Mbappé</div>
                <div class="player-id">#342229</div>
            </div>
        </div>

        <div class="player-chip" onclick="askAbout('Neymar')">
            <div class="player-avatar">🇧🇷</div>
            <div>
                <div class="player-name">Neymar</div>
                <div class="player-id">#68290</div>
            </div>
        </div>

        <hr class="sidebar-divider">

        <div class="quick-title">Quick Questions</div>

        <button class="quick-btn" onclick="sendQuick("What's Messi's current market value?")">
            Messi's market value?
        </button>
        <button class="quick-btn" onclick="sendQuick('Show me Ronaldo transfer history')">
            Ronaldo's transfers?
        </button>
        <button class="quick-btn" onclick="sendQuick('How much did Mbappe cost?')">
            Mbappé transfer fee?
        </button>
        <button class="quick-btn" onclick="sendQuick('Tell me about Haaland')">
            Haaland overview?
        </button>
    </aside>

    <!-- Chat -->
    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="welcome" id="welcome">
                <div class="welcome-ball">⚽</div>
                <h1>FOOTBALL <span>AI</span></h1>
                <p>Ask me anything about player market values, transfer history, and more.</p>
            </div>
        </div>

        <div class="input-area">
            <div class="input-box">
                <textarea
                    id="input"
                    placeholder="Ask about any player..."
                    rows="1"
                    onkeydown="handleKey(event)"
                    oninput="autoResize(this)"
                ></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 21L23 12 2 3v7l15 2-15 2v7z"/>
                    </svg>
                </button>
            </div>
            <div class="input-hint">Press Enter to send · Shift+Enter for new line</div>
        </div>
    </div>

</div>

<script>
    let isLoading = false;

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    function handleKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    function askAbout(player) {
        document.getElementById('input').value = `Tell me about ${player}`;
        sendMessage();
    }

    function sendQuick(question) {
        document.getElementById('input').value = question;
        sendMessage();
    }

    function hideWelcome() {
        const welcome = document.getElementById('welcome');
        if (welcome) welcome.remove();
    }

    function appendMessage(role, text) {
        hideWelcome();
        const messages = document.getElementById('messages');

        const div = document.createElement('div');
        div.className = `message ${role}`;

        const avatar = document.createElement('div');
        avatar.className = 'msg-avatar';
        avatar.textContent = role === 'user' ? '👤' : '⚽';

        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';
        bubble.textContent = text;

        div.appendChild(avatar);
        div.appendChild(bubble);
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return div;
    }

    function showTyping() {
        hideWelcome();
        const messages = document.getElementById('messages');

        const div = document.createElement('div');
        div.className = 'typing';
        div.id = 'typing';

        const avatar = document.createElement('div');
        avatar.className = 'msg-avatar';
        avatar.textContent = '⚽';
        avatar.style.background = 'var(--border)';

        div.innerHTML = `
            <div class="msg-avatar" style="background:var(--border)">⚽</div>
            <div class="typing-dots">
                <span></span><span></span><span></span>
            </div>
        `;

        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    function hideTyping() {
        const typing = document.getElementById('typing');
        if (typing) typing.remove();
    }

    async function sendMessage() {
        if (isLoading) return;

        const input = document.getElementById('input');
        const message = input.value.trim();
        if (!message) return;

        // Clear input
        input.value = '';
        input.style.height = 'auto';

        // Show user message
        appendMessage('user', message);

        // Set loading state
        isLoading = true;
        document.getElementById('sendBtn').disabled = true;
        showTyping();

        try {
            const res = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });

            const data = await res.json();
            hideTyping();

            if (data.error) {
                appendMessage('ai', `Error: ${data.error}`);
            } else {
                appendMessage('ai', data.response);
            }

        } catch (err) {
            hideTyping();
            appendMessage('ai', 'Connection error. Make sure the server is running.');
        }

        isLoading = false;
        document.getElementById('sendBtn').disabled = false;
        input.focus();
    }

    async function resetChat() {
        await fetch('/reset', { method: 'POST' });
        const messages = document.getElementById('messages');
        messages.innerHTML = `
            <div class="welcome" id="welcome">
                <div class="welcome-ball">⚽</div>
                <h1>FOOTBALL <span>AI</span></h1>
                <p>Ask me anything about player market values, transfer history, and more.</p>
            </div>
        `;
    }

    // Focus input on load
    document.getElementById('input').focus();
</script>

</body>
</html>
